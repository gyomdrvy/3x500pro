// V4 : chaque classe possède une liste d'élèves et plusieurs évaluations indépendantes.
function makeEval(name,students){return {id:uid(),name,created:new Date().toISOString().slice(0,10),students:students.map(s=>({...newStudent(s.name,s.sex),id:s.id,last:s.last,first:s.first})),timers:{}}}
function ensureClass(c){
 if(!Array.isArray(c.students))c.students=[];
 if(!Array.isArray(c.evaluations)){
   c.evaluations=[{id:'eval-initial-'+c.id,name:'Évaluation initiale',created:'',students:c.students,timers:c.timers||{}}];
   c.activeEvaluationId=c.evaluations[0].id;
 }
 if(!c.evaluations.length)c.evaluations=[makeEval('Évaluation 1',c.students)];
 if(!c.evaluations.some(e=>e.id===c.activeEvaluationId))c.activeEvaluationId=c.evaluations[0].id;
 for(const e of c.evaluations){if(!Array.isArray(e.students))e.students=[];if(!e.timers)e.timers={};for(const s of c.students)if(!e.students.some(x=>x.id===s.id))e.students.push({...newStudent(s.name,s.sex),id:s.id});}
}
if(!Array.isArray(data.classes))data.classes=[];
if(!data.classes.length)data.classes=[{id:'initial',name:'Ma classe',students:[],timers:{}}];
for(const c of data.classes)ensureClass(c);
if(!data.classes.some(c=>c.id===data.activeClassId))data.activeClassId=data.classes[0].id;
function activeClass(){return data.classes.find(c=>c.id===data.activeClassId)||data.classes[0]}

function renameEvaluation(){let e=activeEval();let name=prompt('Nouveau nom de l’évaluation',e.name);if(name&&name.trim()){e.name=name.trim();save();render()}}
function duplicateEvaluation(){syncClass();let c=activeClass(),old=activeEval();let name=prompt('Nom de la copie',old.name+' (copie)');if(!name||!name.trim())return;let e=JSON.parse(JSON.stringify(old));e.id=uid();e.name=name.trim();e.created=new Date().toISOString().slice(0,10);e.timers={};c.evaluations.push(e);c.activeEvaluationId=e.id;loadActive();save();render()}

function addRosterStudent(name,sex='G'){let c=activeClass(),s=newStudent(name,sex);c.students.push({id:s.id,name:s.name,sex:s.sex});for(const e of c.evaluations)e.students.push({...newStudent(name,sex),id:s.id});loadActive()}
function updateRosterStudent(id,field,value){let c=activeClass(),s=c.students.find(x=>x.id===id);if(!s)return;s[field]=value;if(field==='name'){delete s.last;delete s.first}for(const e of c.evaluations){let st=e.students.find(x=>x.id===id);if(st){st[field]=value;if(field==='name'){delete st.last;delete st.first}}}save();render()}
function deleteRosterStudent(id){if(!confirm('Supprimer cet élève de la classe ET de toutes ses évaluations ?'))return;let c=activeClass();c.students=c.students.filter(s=>s.id!==id);for(const e of c.evaluations)e.students=e.students.filter(s=>s.id!==id);loadActive();save();render()}

function uid(){return Math.random().toString(36).slice(2,10)} const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){syncClass();try{localStorage.setItem(KEY,JSON.stringify(data));$('saveState').textContent='✓ Enregistré'}catch(e){alert('Stockage plein : exportez les données.')}}
function sec(value){
 const text=String(value??'').trim();
 const match=text.match(/^(\d+)[:.,](\d{2})$/);
 const seconds=match&&Number(match[2])<60?Number(match[1])*60+Number(match[2]):/^\d+$/.test(text)?Number(text):NaN;
 return Number.isSafeInteger(seconds)&&seconds>0?seconds:null;
}
function fmt(seconds){
 if(seconds==null)return '—';
 return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');
}
function points(value, range){
 if(value===''||value==null)return null;
 const n=Number(value);
 return range&&n>=range[0]&&n<=range[1]&&Number.isInteger(n*2)?n:null;
}
function aflpDegree(delta, walk){
 if(walk)return 0;
 if(delta==null)return null;
 return delta<5?3:delta<15?2:1;
}
function calculate(s){
 const runs=[1,2,3].map(i=>{
   const time=sec(s['c'+i]),split=sec(s['split'+i]),project=sec(s['project'+i]);
   const delta=split!=null&&time!=null&&split<time?time-2*split:null;
   return {time,split,delta,error:time!=null&&project!=null?Math.abs(time-project):null,speed:time?1800/time:null};
 });
 const times=runs.map(r=>r.time),complete=times.every(t=>t!=null);
 const total=complete?times.reduce((a,b)=>a+b,0):null;
 const gap=complete?Math.max(...times)-Math.min(...times):null;
 const degree=gap==null?null:gap<5?3:gap<10?2:gap<=15?1:0;
 const performance=total==null?null:perfPoints[perfLimits[s.sex==='F'?'F':'G'].findIndex(limit=>total<=limit)]??0;
 const regularity=points(s.regularity,ranges.regularity[degree]);
 const observation=Number(s.observation||1);
 const degree2=aflpDegree(runs[observation-1]?.delta,s.walk===String(observation));
 const aflp2=points(s.aflp2,ranges.aflp2[degree2]);
 const weight=Number(s.weight||4);
 const aflp3=points(s.aflp3,[0,weight]);
 const aflp5=points(s.aflp5,[0,8-weight]);
 const components=[performance,regularity,aflp2,aflp3,aflp5];

function parseCSV(text){

 const delimiter=header.includes(';')?';':header.includes('\t')?'\t':',';
 const rows=[];
 let row=[],field='',quoted=false;
 for(let i=0;i<clean.length;i++){
   const ch=clean[i];
   if(ch==='"'){
     if(quoted&&clean[i+1]==='"'){field+='"';i++}
     else quoted=!quoted;
   }else if(!quoted&&ch===delimiter){row.push(field);field=''}
   else if(!quoted&&ch==='\n'){row.push(field.trim());rows.push(row);row=[];field=''}

 if(quoted)throw Error('Guillemets non fermés dans le CSV.');
 rows.push([...row,field]);
 importRows(rows);
}

}

function render(){let c=computed();$('nav').innerHTML=tabs.map((x,i)=>`<button class="${i===tab?'active':''}" onclick="tab=${i};document.body.classList.remove('nav-open');render()"><span class="nav-ico">${['▦','◷','♧','⚑','⚑','☑','▥','▤'][i]}</span><span>${['Classes & évaluations','Course 1','Repères','Course 2','Course 3','Barème & points','Suivi & progression','Bilan & exports'][i]}</span></button>`).join('');let html='';
if(tab===0){let cl=activeClass();html=`<section class="panel"><h2>Mes classes</h2><p class="muted">Chaque classe conserve sa liste d'élèves et toutes ses évaluations.</p><div class="row"><label>Classe <select onchange="switchClass(this.value)">${data.classes.map(x=>`<option value="${esc(x.id)}" ${x.id===data.activeClassId?'selected':''}>${esc(x.name)} (${x.students.length} élèves)</option>`).join('')}</select></label><button class="primary" onclick="createClass()">+ Classe</button><button onclick="renameClass()">Renommer</button><button class="danger" onclick="deleteClass()">Supprimer classe</button></div></section><section class="panel"><h2>Évaluations — ${esc(cl.name)}</h2><p class="muted">Crée autant d'évaluations que nécessaire. Les résultats, chronos et notes sont indépendants pour chaque évaluation.</p><div class="row"><label>Évaluation <select onchange="switchEvaluation(this.value)">${cl.evaluations.map(e=>`<option value="${esc(e.id)}" ${e.id===cl.activeEvaluationId?'selected':''}>${esc(e.name)}</option>`).join('')}</select></label><button class="primary" onclick="createEvaluation()">+ Nouvelle évaluation</button><button onclick="duplicateEvaluation()">Dupliquer</button><button onclick="renameEvaluation()">Renommer</button><button class="danger" onclick="deleteEvaluation()">Supprimer évaluation</button></div></section><section class="panel"><h2>Élèves — ${esc(cl.name)}</h2><p class="muted">Import Excel (.xlsx, .xls) ou CSV. Les élèves ajoutés sont disponibles dans toutes les évaluations de la classe.</p><div class="row"><input type="file" id="csv" accept=".xlsx,.xls,.csv,.txt,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"><button onclick="let n=prompt('Nom et prénom de l’élève');if(n){addRosterStudent(n);save();render()}">+ Élève</button><button onclick="download('sauvegarde_toutes_classes.json',JSON.stringify({...data,version:'terminale-pro-1'},null,2),'application/json')">⬇ Sauvegarder toutes les classes</button><label class="btn">Restaurer JSON <input style="width:160px" type="file" id="restore" accept=".json"></label></div></section><section class="panel scroll"><table><thead><tr><th>Élève</th><th>Sexe</th><th>Action</th></tr></thead><tbody>${cl.students.map(s=>`<tr><td><input class="student-name-input" type="text" value="${esc(s.name)}" onchange="updateRosterStudent('${s.id}','name',this.value)"></td><td><select onchange="updateRosterStudent('${s.id}','sex',this.value)"><option ${s.sex==='G'?'selected':''}>G</option><option ${s.sex==='F'?'selected':''}>F</option></select></td><td><button class="danger" onclick="deleteRosterStudent('${s.id}')">Supprimer</button></td></tr>`).join('')}</tbody></table></section>`}

if([1,3,4].includes(tab))html=courseView(tab===1?1:tab-1);
if(tab===2)html=summaryView(c.rows,false);
if(tab===5)html=gradingView(c.rows);
if(tab===6)html=progressionView();
if(tab===7)html=summaryView(c.rows,true);
if(tab!==0)html=`<section class="panel row"><strong>${esc(activeClass().name)}</strong><label>Évaluation <select onchange="switchEvaluation(this.value)">${activeClass().evaluations.map(e=>`<option value="${esc(e.id)}" ${e.id===activeClass().activeEvaluationId?'selected':''}>${esc(e.name)}</option>`).join('')}</select></label><button onclick="tab=0;render()">Gérer les évaluations</button></section>`+html;$('app').innerHTML=html;let csv=$('csv');if(csv)csv.onchange=async e=>{let f=e.target.files[0];if(f)await importFile(f)};let restore=$('restore');if(restore)restore.onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.classes)||x.version!=='terminale-pro-1')throw Error();if(confirm('Remplacer toutes les classes actuelles par cette sauvegarde ?')){if(!Array.isArray(x.classes)){x.classes=[{id:'legacy',name:'Classe restaurée',students:x.students,timers:{}}];x.activeClassId='legacy'}if(!x.classes.length)throw Error();data=x;for(const cl of data.classes)ensureClass(cl);if(!data.classes.some(cl=>cl.id===data.activeClassId))data.activeClassId=data.classes[0].id;for(const cl of data.classes)for(const e of cl.evaluations)e.timers={};loadActive();save();render()}}catch{alert('Choisissez une sauvegarde JSON de l’application Terminale Pro.')}};clocks()}

render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script><script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></body></html>
